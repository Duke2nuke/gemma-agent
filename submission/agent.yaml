agent_class: LlmAgent
name: gemma_swe_agent
model: gemma-4-e4b-it-qat-w4a16-ct
description: Repository-agnostic software engineering agent for focused Python fixes in FastAPI, Rich, Requests and HTTPX.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
  - agent_tool: {config_path: sub_agents/code_explorer.yaml, skip_summarization: true}
generate_content_config: !include configs/sampling.yaml
